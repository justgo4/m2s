name: Candidate source-state durability and layouts

on:
  push:
    branches: [main]
    paths:
      - tools/state_layout_benchmark.py
      - tools/source_apply_staging_benchmark.py
      - tools/source_snapshot_staging_benchmark.py
      - tools/source_capture_apply_async_benchmark.py
      - tools/source_gc_overlap_benchmark.py
      - source_state.py
      - requirements-state-benchmark.txt
      - requirements.txt
      - j4.py
      - 'join_*.py'
      - 'tools/join_bootstrap_stream*.py'
      - 'tools/join_bridge_stream*.py'
      - .github/workflows/state.yml
  pull_request:
    paths:
      - tools/state_layout_benchmark.py
      - tools/source_apply_staging_benchmark.py
      - tools/source_snapshot_staging_benchmark.py
      - tools/source_capture_apply_async_benchmark.py
      - tools/source_gc_overlap_benchmark.py
      - source_state.py
      - requirements-state-benchmark.txt
      - requirements.txt
      - j4.py
      - 'join_*.py'
      - 'tools/join_bootstrap_stream*.py'
      - 'tools/join_bridge_stream*.py'
      - .github/workflows/state.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: state-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-state-benchmark.txt
      - run: python tools/privacy_check.py
      - name: Exact streamed JOIN bootstrap and isolated pair-memory A/B
        run: |
          python tools/join_bootstrap_stream_test.py
          python tools/join_output_build_test.py
          python tools/join_bootstrap_stream_benchmark.py --left 1000 --right 100 --repeats 2 --output benchmark-results/join-bootstrap-stream.json
      - name: Bounded streamed JOIN bridge and isolated output-memory A/B
        run: |
          python tools/join_bridge_stream_test.py
          python tools/join_publication_test.py
          python tools/join_bridge_stream_benchmark_test.py
          python tools/join_bridge_stream_benchmark.py --rows 100000 --repeats 2 --output benchmark-results/join-bridge-stream.json
          python tools/join_bridge_stream_benchmark.py --rows 100000 --repeats 2 --configured-candidate --partitions 16 --batch-rows 50000 --batch-bytes 16777216 --output benchmark-results/join-bridge-production.json
      - name: Sync-WAL atomic commits, process crashes, fixed W and suffix replay
        run: python tools/state_layout_benchmark.py --rows 1000 --transactions 10 --changes 20 --repeats 2 --rocks --faults --output benchmark-results/state-contract.json
      - name: High entropy wide values in independent randomized worker processes
        run: python tools/state_layout_benchmark.py --rows 10000 --transactions 100 --changes 50 --width 2048 --entropy high --repeats 3 --rocks --faults --output benchmark-results/state-wide.json
      - name: Source apply disk staging
        run: python tools/source_apply_staging_benchmark.py --rows 100000 --part-rows 5000 --key-space 50000 --output benchmark-results/source-apply-staging.json
      - name: Source snapshot set-wise staging
        run: python tools/source_snapshot_staging_benchmark.py --rows 100000 --batch-rows 5000 --output benchmark-results/source-snapshot-staging.json
      - name: Overlapped durable capture and asynchronous base apply
        run: python tools/source_capture_apply_async_benchmark.py --commits 100 --rows-per-commit 1000 --part-rows 250 --key-space 50000 --max-pending-bytes 33554432 --output benchmark-results/source-capture-apply-async.json
      - name: Capture and apply tail latency under bounded source GC
        run: python tools/source_gc_overlap_benchmark.py --commits 80 --rows-per-commit 500 --part-rows 250 --key-space 10000 --gc-version-rows 512 --gc-commit-rows 32 --gc-sleep-ms 5 --output benchmark-results/source-gc-overlap.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: state-layout-python-${{ matrix.python }}
          path: |
            benchmark-results/join-bootstrap-stream.json
            benchmark-results/join-bridge-stream.json
            benchmark-results/join-bridge-production.json
            benchmark-results/state-contract.json
            benchmark-results/state-wide.json
            benchmark-results/source-apply-staging.json
            benchmark-results/source-snapshot-staging.json
            benchmark-results/source-capture-apply-async.json
            benchmark-results/source-gc-overlap.json
          if-no-files-found: error
