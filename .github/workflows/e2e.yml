name: Actual daemon MySQL to StarRocks contract

on:
  push:
    branches: [main]
    paths:
      - 'j4.py'
      - 'cdc_catalog.py'
      - 'incremental_contract.py'
      - 'incremental_ir.py'
      - 'physical_state_catalog.py'
      - 'p11_profile.py'
      - 'relational_ir.py'
      - 'source_state.py'
      - 'task_generation.py'
      - 'stateful_*.py'
      - 'aggregate_*.py'
      - 'join_*.py'
      - 'native/**'
      - 'tools/aggregate_starrocks_contract.py'
      - 'tools/join_starrocks_contract.py'
      - 'tools/e2e_contract.py'
      - 'tools/stateful_catalog_e2e.py'
      - 'tools/merge_quarantine_network_test.py'
      - 'tools/longhaul_workload.py'
      - 'tools/longhaul_gate.py'
      - 'tools/process_resource_probe.py'
      - 'tools/service_resource_probe.py'
      - 'tools/starrocks_contract.py'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'j4.py'
      - 'cdc_catalog.py'
      - 'incremental_contract.py'
      - 'incremental_ir.py'
      - 'physical_state_catalog.py'
      - 'p11_profile.py'
      - 'relational_ir.py'
      - 'source_state.py'
      - 'task_generation.py'
      - 'stateful_*.py'
      - 'aggregate_*.py'
      - 'join_*.py'
      - 'native/**'
      - 'tools/aggregate_starrocks_contract.py'
      - 'tools/join_starrocks_contract.py'
      - 'tools/e2e_contract.py'
      - 'tools/stateful_catalog_e2e.py'
      - 'tools/merge_quarantine_network_test.py'
      - 'tools/longhaul_workload.py'
      - 'tools/longhaul_gate.py'
      - 'tools/process_resource_probe.py'
      - 'tools/service_resource_probe.py'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      milestone:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.milestone && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        protocol: [merge_async, transaction]
        gtid: ['ON', 'OFF']
        shared: ['OFF', 'ON']
    env:
      TEST_PROTOCOL: ${{ matrix.protocol }}
      TEST_GTID: ${{ matrix.gtid }}
      TEST_SHARED: ${{ matrix.shared }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
      - run: python tools/privacy_check.py
      - run: python -m pip install -r requirements.txt
      - run: python tools/catalog_config_test.py
      - name: Build actual decoder and ABI
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel 2
      - name: Release space from unused hosted-runner toolchains
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Isolated database services
        run: |
          docker run --detach --name m2s-e2e-mysql -p 127.0.0.1:3306:3306 \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes mysql:8.4.6 \
            --server-id=1 --log-bin=mysql-bin --gtid-mode="$TEST_GTID" \
            --enforce-gtid-consistency=ON --binlog-format=ROW --binlog-row-image=FULL
          docker run --detach --network host --name m2s-e2e-starrocks starrocks/allin1-ubuntu:4.1.1
          python - <<'PY'
          import time, pymysql
          for attempt in range(180):
              try:
                  con = pymysql.connect(host='127.0.0.1',user='root',connect_timeout=2)
                  con.close()
                  break
              except pymysql.MySQLError:
                  time.sleep(1)
          else:
              raise RuntimeError('isolated MySQL not ready')
          PY
      - name: Concurrent backfill and changes, exact SQL oracle, hard kill and durable resume
        run: |
          EXTRA=""
          if [ "$TEST_SHARED" = "ON" ]; then EXTRA="--shared-source-state"; fi
          python tools/e2e_contract.py --isolated --load-mode "$TEST_PROTOCOL" --group-size 128 $EXTRA
      - name: Drop a real accepted Merge Commit response, isolate only that target and restart
        if: matrix.protocol == 'merge_async' && matrix.shared == 'OFF'
        run: python tools/merge_quarantine_network_test.py --isolated
      - name: Aggregate fixed-W runtime to real StarRocks 4.1.1
        if: matrix.gtid == 'ON' && matrix.shared == 'ON'
        run: python tools/aggregate_starrocks_contract.py --isolated --load-mode "$TEST_PROTOCOL"
      - name: INNER JOIN runtime to real StarRocks 4.1.1
        if: matrix.gtid == 'ON' && matrix.shared == 'ON'
        run: python tools/join_starrocks_contract.py --isolated --load-mode "$TEST_PROTOCOL"
      - name: Catalog stateful aggregate/JOIN daemon contract
        if: matrix.gtid == 'ON' && matrix.shared == 'ON'
        run: python tools/stateful_catalog_e2e.py --isolated --load-mode "$TEST_PROTOCOL"
      - name: Live P11 mixed aggregate/JOIN fault smoke
        if: matrix.protocol == 'merge_async' && matrix.gtid == 'ON' && matrix.shared == 'ON'
        run: |
          MYSQL_RESOURCE_PID="$(docker inspect --format '{{.State.Pid}}' m2s-e2e-mysql)"
          STARROCKS_RESOURCE_PID="$(docker inspect --format '{{.State.Pid}}' m2s-e2e-starrocks)"
          test "$MYSQL_RESOURCE_PID" -gt 0
          test "$STARROCKS_RESOURCE_PID" -gt 0
          python tools/longhaul_workload.py --isolated --load-mode merge_async \
            --rows 5000 --rows-per-second 50 --duration-seconds 60 \
            --dynamic-tasks 2 --dynamic-task-mix mixed \
            --fault-every-seconds 20 --sample-seconds 0.5 \
            --snapshot-rows 512 --memory-mb 4096 \
            --mysql-resource-pid "$MYSQL_RESOURCE_PID" \
            --starrocks-fe-resource-pid "$STARROCKS_RESOURCE_PID" \
            --starrocks-be-resource-pid "$STARROCKS_RESOURCE_PID" \
            --output benchmark-results/longhaul-smoke.json
          python tools/longhaul_gate.py benchmark-results/longhaul-smoke.json \
            --min-elapsed-seconds 55 --min-snapshot-rows 5000 \
            --max-p95-seconds 30 --max-p99-seconds 60 \
            --min-cdc-rows-per-second 40 \
            --min-latency-samples-per-second 0.2 \
            --min-dynamic-tasks 2 --min-faults 1 \
            --output benchmark-results/longhaul-smoke-gate.json
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-failure-${{ matrix.protocol }}-gtid-${{ matrix.gtid }}-shared-${{ matrix.shared }}
          path: benchmark-results/**
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-${{ matrix.protocol }}-gtid-${{ matrix.gtid }}-shared-${{ matrix.shared }}
          path: |
            benchmark-results/e2e-contract.json
            benchmark-results/aggregate-starrocks-contract.json
            benchmark-results/join-starrocks-contract.json
            benchmark-results/stateful-catalog-contract.json
            benchmark-results/merge-quarantine.json
            benchmark-results/longhaul-smoke.json
            benchmark-results/longhaul-smoke-checkpoint.json
            benchmark-results/longhaul-smoke-gate.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable services
        if: always()
        run: |
          docker rm --force m2s-e2e-mysql || true
          docker rm --force m2s-e2e-starrocks || true
