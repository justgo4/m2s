name: Fixed SHA milestone certification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/milestone.yml'
      - 'MILESTONE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milestone-${{ github.sha }}
  cancel-in-progress: false

jobs:
  baseline:
    uses: ./.github/workflows/ci.yml
    with:
      milestone: true

  native:
    uses: ./.github/workflows/integration.yml
    with:
      milestone: true

  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      milestone: true

  evidence:
    if: always()
    needs: [baseline, native, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MILESTONE_SHA: ${{ github.sha }}
      MILESTONE_RUN_ID: ${{ github.run_id }}
      MILESTONE_RUN_ATTEMPT: ${{ github.run_attempt }}
      MILESTONE_ACTOR: ${{ github.actor }}
      BASELINE_RESULT: ${{ needs.baseline.result }}
      NATIVE_RESULT: ${{ needs.native.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - name: Write fixed-SHA evidence manifest
        run: |
          python - <<'PY'
          import json, os, time
          results={
              "baseline":os.environ["BASELINE_RESULT"],
              "native":os.environ["NATIVE_RESULT"],
              "e2e":os.environ["E2E_RESULT"],
          }
          manifest={
              "format_version":1,
              "milestone_sha":os.environ["MILESTONE_SHA"],
              "workflow_run_id":int(os.environ["MILESTONE_RUN_ID"]),
              "workflow_run_attempt":int(os.environ["MILESTONE_RUN_ATTEMPT"]),
              "actor":os.environ["MILESTONE_ACTOR"],
              "recorded_at_unix":time.time(),
              "results":results,
              "same_revision":True,
              "scope":[
                  "public_baseline_ci",
                  "native_contracts_and_isolated_mysql",
                  "actual_daemon_mysql_to_starrocks_8_cell_e2e",
                  "stateful_lifecycle_and_merge_quarantine",
              ],
              "certified":all(value=="success" for value in results.values()),
          }
          os.makedirs("milestone-evidence",exist_ok=True)
          with open(
              "milestone-evidence/manifest.json","w",encoding="utf-8"
          ) as handle:
              json.dump(
                  manifest,handle,ensure_ascii=False,
                  indent=2,sort_keys=True)
              handle.write("\n")
          print(json.dumps(manifest,sort_keys=True),flush=True)
          PY
      - name: Upload fixed-SHA evidence manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: milestone-${{ github.sha }}
          path: milestone-evidence/manifest.json
          if-no-files-found: error
          retention-days: 1
      - name: Require every evidence workflow to pass
        if: always()
        run: |
          python - <<'PY'
          import os
          results={
              "baseline":os.environ["BASELINE_RESULT"],
              "native":os.environ["NATIVE_RESULT"],
              "e2e":os.environ["E2E_RESULT"],
          }
          failed={
              name:value
              for name,value in results.items()
              if value!="success"
          }
          if failed:
              raise SystemExit(
                  "milestone evidence incomplete: "+repr(failed))
          print(
              "MILESTONE PASS sha="+os.environ["MILESTONE_SHA"],
              flush=True)
          PY
