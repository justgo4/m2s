name: Native contracts and isolated MySQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      milestone:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: integration-${{ inputs.milestone && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build decoder
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel 2
      - name: Start disposable MySQL 8.4.6 with FULL images and GTID
        run: |
          docker run --detach --name m2s-mysql -p 127.0.0.1:3306:3306 \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes mysql:8.4.6 \
            --server-id=1 --log-bin=mysql-bin --gtid-mode=ON \
            --enforce-gtid-consistency=ON --binlog-format=ROW \
            --binlog-row-image=FULL --binlog-row-metadata=FULL
          python - <<'PY'
          import time, pymysql
          for attempt in range(180):
              try:
                  con = pymysql.connect(host='127.0.0.1',user='root',connect_timeout=2)
                  with con.cursor() as cur:
                      cur.execute('SELECT VERSION()')
                      print('Isolated MySQL version:',cur.fetchone()[0],flush=True)
                  con.close()
                  break
              except pymysql.MySQLError:
                  time.sleep(1)
          else:
              raise RuntimeError('isolated MySQL did not become ready')
          PY
      - name: Actual raw binlog Python/native differential, 1000 transactions
        run: python tools/binlog_parity.py --live --cases 1000 --output benchmark-results/live-mysql-contract.json
      - name: Actual production snapshot Python/native A/B on isolated fixture
        run: python tools/snapshot_benchmark.py --isolated --repeats 5 --batch-rows 512
      - name: Publish synthetic counts and environment only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mysql-contract
          path: |
            benchmark-results/live-mysql-contract.json
            benchmark-results/snapshot.json
          if-no-files-found: error
      - name: Remove isolated database
        if: always()
        run: docker rm --force m2s-mysql || true

  sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: |
          cmake -S native -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DM2S_SANITIZERS=ON
          cmake --build build/sanitized --parallel 2
          build/sanitized/mysql_arrow_reader --selftest
          python tools/binlog_parity.py --binary build/sanitized/mysql_arrow_reader --cases 1000 --faults

  starrocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - name: Release space from unused hosted-runner toolchains
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start isolated StarRocks 4.1.1 without changing server parameters
        run: docker run --detach --network host --name m2s-starrocks starrocks/allin1-ubuntu:4.1.1
      - name: Prove 2PC and async merge independently; probe combined headers with negative control
        run: python tools/starrocks_contract.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: starrocks-protocol-contract
          path: benchmark-results/starrocks-contract.json
          if-no-files-found: error
      - name: Remove isolated StarRocks
        if: always()
        run: docker rm --force m2s-starrocks || true
