name: Public baseline CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      milestone:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-ci-${{ inputs.milestone && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: |
          python tools/privacy_selftest.py
          python tools/privacy_check.py

  baseline:
    needs: privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONUNBUFFERED: '1'
      CDC_NATIVE_PARTITION: required
      CDC_NATIVE_JSON: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install fixed baseline dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and CLI
        run: |
          python -m compileall -q aggregate_task_catalog.py aggregate_task_runner.py aggregate_target_mapping.py aggregate_runtime.py aggregate_job_bridge.py aggregate_outbox.py aggregate_shared_runtime.py aggregate_generation.py aggregate_physical_state.py aggregate_bootstrap.py aggregate_ir.py aggregate_log_consumer.py aggregate_state.py join_bootstrap.py join_generation.py join_ir.py join_job_bridge.py join_log_consumer.py join_outbox.py join_shared_runtime.py join_physical_state.py join_runtime.py join_state.py join_target_mapping.py join_task_catalog.py join_task_runner.py source_log_consumer.py j4.py catalog_explain.py cdc_catalog.py cdc_selftest.py incremental_contract.py incremental_ir.py physical_state_catalog.py relational_ir.py source_state.py stateful_catalog_runtime.py stateful_physical_registry.py stateful_admission.py stateful_rebuild.py stateful_rebuild_cohort.py stateful_share_policy.py stateful_task_plan.py task_generation.py native tools
          python j4.py --help
          python tools/aggregate_bootstrap_test.py
          python tools/aggregate_generation_test.py
          python tools/aggregate_job_bridge_test.py
          python tools/aggregate_ir_test.py
          python tools/aggregate_log_consumer_test.py
          python tools/aggregate_runtime_test.py
          python tools/aggregate_shared_runtime_test.py
          python tools/aggregate_subview_shared_runtime_test.py
          python tools/aggregate_state_test.py
          python tools/aggregate_target_mapping_test.py
          python tools/aggregate_state_oracle.py
          python tools/aggregate_task_catalog_test.py
          python tools/catalog_config_test.py
          python tools/catalog_explain_test.py
          python tools/catalog_preview_test.py
          python tools/catalog_plan_cache_test.py
          python tools/catalog_stateful_manifest_test.py
          python tools/stateful_task_plan_test.py
          python tools/stateful_catalog_runtime_test.py
          python tools/stateful_hot_add_test.py
          python tools/stateful_physical_registry_test.py
          python tools/metric_slo_test.py
          python tools/p11_profile_test.py
          python tools/validation_run_test.py
          python tools/runner_inventory_test.py
          python tools/state_backup_test.py
          python tools/operational_check_test.py
          python tools/cdc_bundle_test.py
          python tools/snapshot_bundle_test.py
          python tools/source_snapshot_budget_test.py
          python tools/longhaul_gate_test.py
          python tools/longhaul_workload_test.py
          python tools/process_resource_probe_test.py
          python tools/service_resource_probe_test.py
          python tools/stateful_rebuild_test.py
          python tools/stateful_rebuild_scale_test.py
          python tools/stateful_rebuild_concurrency_test.py
          python tools/stateful_rebuild_multi_test.py
          python tools/stateful_rebuild_cohort_test.py
          python tools/stateful_share_policy_test.py
          python tools/stateful_share_graph_test.py
          python tools/stateful_admission_test.py
          python tools/stateful_admission_integration_test.py
          python tools/stateful_admission_retry_test.py
          python tools/status_test.py
          python tools/shared_state_scale_test.py
          python tools/shared_follower_gc_scale_test.py
          python tools/shared_subview_scale_test.py
          python tools/shared_join_state_scale_test.py
          python tools/shared_join_follower_gc_scale_test.py
          python tools/shared_join_subview_scale_test.py
          python tools/incremental_contract_test.py
          python tools/incremental_ir_test.py
          python tools/join_bootstrap_test.py
          python tools/join_generation_test.py
          python tools/join_ir_test.py
          python tools/join_job_bridge_test.py
          python tools/join_runtime_test.py
          python tools/join_shared_runtime_test.py
          python tools/join_subview_shared_runtime_test.py
          python tools/join_state_test.py
          python tools/join_incremental_delta_test.py
          python tools/join_state_oracle.py
          python tools/join_target_mapping_test.py
          python tools/join_task_catalog_test.py
          python tools/incremental_ir_state_oracle.py
          python tools/physical_state_catalog_test.py
          python tools/relational_ir_test.py
          python tools/source_base_catalog_test.py
          python tools/source_state_protocol_test.py
          python tools/source_gc_concurrency_test.py
          python tools/source_apply_setwise_test.py
          python tools/source_snapshot_setwise_test.py
          python tools/source_apply_worker_test.py
          python tools/source_apply_contention_test.py
          python tools/arrow_job_schema_test.py
          python tools/source_pipeline_metrics_test.py
          python tools/source_transaction_spool_test.py
          python tools/source_log_consumer_test.py
          python tools/source_seq_frontier_test.py
          python tools/task_generation_test.py
          python tools/resource_startup_test.py
          python tools/merge_quarantine_test.py
          python tools/merge_commit_identity_test.py
      - name: Verify bundled native ABI and offline recovery
        run: |
          python native/native_abi_selftest.py
          python j4.py selftest
      - name: Build all native sources
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel 2
          cp build/native/mysql_arrow_reader mysql_arrow_reader-linux-x86_64
          ./mysql_arrow_reader-linux-x86_64 --selftest
          if readelf -d native/libj4_native.so | grep -q NEEDED; then
            echo 'native partition library unexpectedly depends on libc'
            exit 1
          fi
      - name: Verify built native ABI and full offline regression
        run: |
          python native/native_abi_selftest.py
          python j4.py selftest
      - name: Same-byte row and snapshot differential tests and 1000 native faults
        run: python tools/binlog_parity.py --cases 1000 --faults --output benchmark-results/native-contract.json
      - name: Native capture recovery from durable cursor, 1000 traces
        run: python tools/native_recovery_test.py --cases 1000
      - name: Decoder and durable local A/B smoke
        run: |
          python tools/decoder_benchmark.py --events 128 --rows-per-event 4 --repeats 3 --layer decoder
          python tools/decoder_benchmark.py --events 128 --rows-per-event 4 --repeats 3 --layer local --output benchmark-results/local.json
      - name: Candidate state layouts and atomic commit crash recovery
        run: python tools/state_layout_benchmark.py --rows 1000 --transactions 10 --changes 20 --repeats 2 --faults
      - name: Synthetic benchmark smoke
        run: |
          python tools/partition_benchmark.py --rows 10000 --repeats 3 --commit '${{ github.event.pull_request.head.sha || github.sha }}'
          python tools/stateful_sharing_ab_benchmark.py --tasks 1,10,100 --output benchmark-results/stateful-sharing-ab.json
          python tools/source_apply_staging_benchmark.py --rows 5000 --part-rows 500 --key-space 2500 --output benchmark-results/source-apply-staging.json
          python tools/source_snapshot_staging_benchmark.py --rows 5000 --batch-rows 500 --output benchmark-results/source-snapshot-staging.json
          python tools/source_capture_apply_async_benchmark.py --commits 10 --rows-per-commit 500 --part-rows 100 --key-space 2500 --max-pending-bytes 1048576 --output benchmark-results/source-capture-apply-async.json
