name: Native decoder and durable pipeline A/B

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'j4.py'
      - 'tools/binlog_contract.py'
      - 'tools/decoder_benchmark.py'
      - '.github/workflows/decoder-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decoder-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layer: [decoder, local]
        workload: [tiny, dense, wide]
    env:
      BENCH_LAYER: ${{ matrix.layer }}
      BENCH_WORKLOAD: ${{ matrix.workload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python tools/privacy_check.py
      - run: python -m pip install -r requirements.txt
      - run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel 2
      - name: Correctness before timing
        run: python tools/binlog_parity.py --cases 1000 --faults
      - name: Five fresh-process samples per method
        shell: bash
        run: |
          case "$BENCH_WORKLOAD" in
            tiny) events=1000; density=1; width=0 ;;
            dense) events=512; density=64; width=0 ;;
            wide) events=256; density=8; width=4096 ;;
            *) exit 2 ;;
          esac
          python tools/decoder_benchmark.py --layer "$BENCH_LAYER" \
            --events "$events" --rows-per-event "$density" --width "$width" \
            --events-per-transaction 64 --repeats 5 \
            --output "benchmark-results/${BENCH_LAYER}-${BENCH_WORKLOAD}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-AB-${{ matrix.layer }}-${{ matrix.workload }}-${{ github.sha }}
          path: benchmark-results/${{ matrix.layer }}-${{ matrix.workload }}.json
          if-no-files-found: error
          retention-days: 14
